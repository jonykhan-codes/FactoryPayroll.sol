<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Payroll Dashboard</title>
  <!-- Ethers.js v5.7.2 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
    .header { text-align: center; }
    .header h1 { font-size: 26px; font-weight: 700; color: #fff; }
    .header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #059669; }
    .wallet-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-top: 12px; background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; }
    .wallet-address { font-family: monospace; color: var(--text); font-weight: 600; }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    .status-box { font-size: 13px; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); color: var(--text-muted); word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🏭 Factory Payroll</h1>
      <p>Decentralized Worker Payment System</p>
    </div>

    <!-- Wallet Section -->
    <div class="card">
      <button id="connectBtn" class="btn btn-primary" onclick="connectWallet()">Connect MetaMask</button>
      <div class="wallet-info">
        <span>Connected:</span>
        <span id="userAddress" class="wallet-address">Not Connected</span>
      </div>
    </div>

    <!-- Add Worker Section -->
    <div class="card">
      <h2>Add New Worker</h2>
      <div class="input-group">
        <input type="text" id="workerAddr" placeholder="Worker Wallet Address (0x...)">
        <input type="text" id="workerName" placeholder="Worker Name">
        <input type="number" id="dailyRate" step="0.001" placeholder="Daily Rate (in USDC)">
      </div>
      <button class="btn btn-primary" onclick="addWorker()">Add Worker</button>
    </div>

    <!-- Execute Payroll Section -->
    <div class="card">
      <h2>Execute Payroll</h2>
      <button class="btn btn-success" onclick="payAllWorkers()">Pay All Active Workers</button>
    </div>

    <!-- Status Log -->
    <div class="card">
      <h2>Transaction Log</h2>
      <div id="status" class="status-box">Ready</div>
    </div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0xF0653663525B0DeFF947B0B578402D59a8b90928";

    const CONTRACT_ABI = [
      "function addWorker(address _workerAddress, string memory _name, uint256 _dailyRate) external",
      "function payAllWorkers() external",
      "function getContractBalance() external view returns (uint256)"
    ];

    let provider;
    let signer;
    let contract;

    async function connectWallet() {
      if (typeof window.ethereum !== 'undefined') {
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();
          
          const account = accounts[0];
          document.getElementById("userAddress").innerText = account.substring(0, 6) + "..." + account.substring(account.length - 4);
          document.getElementById("connectBtn").innerText = "Wallet Connected";
          
          contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
          updateStatus("Wallet connected successfully!");
        } catch (error) {
          updateStatus("Connection Error: " + error.message);
        }
      } else {
        alert("MetaMask is not installed. Please install MetaMask to use this app!");
      }
    }

    async function addWorker() {
      if (!contract) return alert("Please connect wallet first!");
      const addr = document.getElementById("workerAddr").value;
      const name = document.getElementById("workerName").value;
      const rateInput = document.getElementById("dailyRate").value;

      if(!addr || !name || !rateInput) return alert("Please fill all fields!");

      try {
        // ✅ USDC 6 Decimals এর জন্য parseUnits(..., 6)
        const rateInWei = ethers.utils.parseUnits(rateInput, 6);
        updateStatus("Sending transaction to add worker...");
        
        const tx = await contract.addWorker(addr, name, rateInWei);
        await tx.wait();
        
        updateStatus("Worker added successfully! Tx: " + tx.hash);
      } catch (error) {
        updateStatus("Failed to add worker: " + (error.reason || error.message));
      }
    }

    async function payAllWorkers() {
      if (!contract) return alert("Please connect wallet first!");

      try {
        updateStatus("Executing payroll transaction...");
        const tx = await contract.payAllWorkers();
        await tx.wait();
        
        updateStatus("All active workers paid successfully! Tx: " + tx.hash);
      } catch (error) {
        updateStatus("Payment failed: " + (error.reason || error.message));
      }
    }

    function updateStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>
</body>
</html>
